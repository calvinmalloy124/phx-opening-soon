name: Daily scrape
on:
  schedule:
    - cron: "17 14 * * *"   # 7:17am Phoenix time (no DST in AZ)
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr poppler-utils > /dev/null
      - run: pip install -r requirements.txt pytesseract pdf2image playwright && python -m playwright install --with-deps chromium
      - name: Statewide pending applications (AZ DLLC)
        run: python statewide.py || echo 'statewide fetch failed; continuing'
      - name: Statewide pending applications (AZ DLLC)
        run: python statewide.py || echo "statewide fetch failed; continuing"
      - run: python scrape.py
      - run: python merge_statewide.py
      - run: python merge_statewide.py
      - run: python enrich.py
        env:
          BRAVE_KEY: ${{ secrets.BRAVE_API }}
          DUMP_OCR: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - run: python build_site.py
      - name: Commit data
        run: |
          git config user.name "scraper-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data site
          git diff --cached --quiet || git commit -m "daily scrape $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
