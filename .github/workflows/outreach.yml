name: Outreach
on:
  schedule:
    - cron: "17 16 * * 1-5"   # 9:17am Arizona, weekdays
  workflow_dispatch:
    inputs:
      limit:
        description: "max sends today"
        default: "10"
permissions:
  contents: write
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Find vendor emails (25 per run)
        run: python outreach/find_emails.py
        env:
          BRAVE_API: ${{ secrets.BRAVE_API }}
      - name: Send today's outreach
        run: python outreach/send_outreach.py
        env:
          GMAIL_USER: hello@liquorlicenseleads.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DAILY_LIMIT: ${{ github.event.inputs.limit || '10' }}
      - name: Commit ledger
        run: |
          git config user.name "outreach-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/vendors_enriched.csv data/outreach_log.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "outreach $(date -u +%F)" && git push)
